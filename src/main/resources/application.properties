spring.application.name=utm-flight-registration
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/utm-v2-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2-time-marker.sql
utm.coordinates.reference-system=WGS84
utm.coordinates.altitude-reference=AMSL
utm.coordinates.altitude-unit=metres
spring.web.resources.cache.period=0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
