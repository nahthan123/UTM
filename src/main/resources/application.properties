spring.application.name=utm-flight-registration
spring.config.import=optional:file:./application-local.properties
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/utm-v2-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2-time-marker.sql
utm.coordinates.reference-system=WGS84
utm.coordinates.altitude-reference=AGL
utm.coordinates.altitude-unit=metres
spring.web.resources.cache.period=0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
# http sends committed MONITORING outbox rows to the 3D backend; SIMULATION remains PENDING.
utm.integration.mode=${UTM_INTEGRATION_MODE:mock}
utm.integration.monitoring-url=${UTM_MONITORING_URL:http://127.0.0.1:8000/api/integration/flight-plans}
utm.integration.monitoring-token=${UTM_MONITORING_TOKEN:}

# Interactive API documentation uses the same session cookie as the web portal.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.default-models-expand-depth=1
