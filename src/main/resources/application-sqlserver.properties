spring.datasource.url=${UTM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=utm;encrypt=true;trustServerCertificate=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${UTM_DB_USERNAME}
spring.datasource.password=${UTM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.sql.init.schema-locations=classpath:db/sqlserver-time-marker.sql
